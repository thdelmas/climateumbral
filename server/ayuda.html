const pick = () => localStorage.getItem('relay_lang') || (['es','fr','en'].includes(navigator.language.slice(0,2)) ? navigator.language.slice(0,2) : 'en');
function render(l) {
  localStorage.setItem('relay_lang', l);
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.innerHTML = M[l][e.dataset.i18n] || ''; });
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  if (typeof buildShare === 'function') buildShare(l);
  if (typeof syncCountry === 'function') syncCountry(l);

}
document.querySelectorAll('.langs button').forEach(b => b.onclick = () => render(b.dataset.l));
render(pick());

const VERIFIED_AT = '2026-07-27';
if (Date.now() - new Date(VERIFIED_AT + 'T12:00:00Z').getTime() > 48 * 3600 * 1000)
  document.getElementById('staleWarn').hidden = false;

function buildShare(l) {
  const SHARE_URL = 'https://climateumbral.eu/ayuda/';
  const t = M[l].shareText;
  const NETS = [
    ['WhatsApp', '#25D366', 'https://wa.me/?text=' + encodeURIComponent(t + ' ' + SHARE_URL)],
    ['Telegram', '#229ED9', 'https://t.me/share/url?url=' + encodeURIComponent(SHARE_URL) + '&text=' + encodeURIComponent(t)],
    ['Facebook', '#1877F2', 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(SHARE_URL)],
    ['X', '#000000', 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(t) + '&url=' + encodeURIComponent(SHARE_URL)],
    ['LinkedIn', '#0A66C2', 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(SHARE_URL)],
  ];
  document.querySelectorAll('[data-sharebar]').forEach(bar => {
    let html = '';
    if (navigator.share) html += '<button class="share sp-native" type="button">' + M[l].shareBtn + '</button>';
    html += NETS.map(n =>
      '<a class="spill" style="background:' + n[1] + '" href="' + n[2] + '" target="_blank" rel="noopener" aria-label="' + M[l].shareBtn + ' - ' + n[0] + '">' + n[0] + '</a>'
    ).join('');
    html += '<button class="spill sp-copy" type="button">' + M[l].copyBtn + '</button>';
    bar.innerHTML = html;
    const nat = bar.querySelector('.sp-native');
    if (nat) nat.onclick = () => navigator.share({ title: document.title, text: t, url: SHARE_URL }).catch(() => {});
    bar.querySelector('.sp-copy').onclick = async (e) => {
      try {
        await navigator.clipboard.writeText(SHARE_URL);
        e.target.textContent = M[l].copiedMsg;
        setTimeout(() => { e.target.textContent = M[l].copyBtn; }, 1500);
      } catch { prompt('URL:', SHARE_URL); }
    };
  });
}

// country follows the page language until the visitor touches it
var rnCountryTouched = false;
document.getElementById('rnCountry').addEventListener('change', () => { rnCountryTouched = true; });
function syncCountry(l) {
  if (!rnCountryTouched && (l === 'fr' || l === 'es'))
    document.getElementById('rnCountry').value = l.toUpperCase();
}
syncCountry(localStorage.getItem('relay_lang') || 'es');

document.getElementById('rnForm').onsubmit = async (ev) => {
  ev.preventDefault();
  const l = localStorage.getItem('relay_lang') || 'es';
  const g = id => document.getElementById(id).value.trim();
  const msg = document.getElementById('rnMsg');
  const btn = document.querySelector('#rnForm button');
  btn.disabled = true;
  msg.textContent = '';
  try {
    const r = await fetch('/api/waitlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: g('rnEmail'), status: g('rnStatus'), country: g('rnCountry'),
        region: g('rnRegion'), city: g('rnCity'), lang: l, website: g('rnWebsite') }),
    });
    if (!r.ok) throw 0;
    document.querySelectorAll('#rnForm input, #rnForm select').forEach(x => x.disabled = true);
    msg.style.color = 'var(--ok, #047857)';
    msg.textContent = M[l].rnDone;
  } catch {
    btn.disabled = false;
    msg.style.color = 'var(--danger)';
    msg.textContent = M[l].rnErr;
  }
};
