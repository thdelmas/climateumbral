<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ClimateUmbral — back office</title>
<style>
:root{color-scheme:light dark;
  --bg:#fff;--fg:#1a1a1a;--mut:#667;--line:#ddd;--card:#f6f7f8}
@media(prefers-color-scheme:dark){:root{
  --bg:#101214;--fg:#e8eaec;--mut:#99a;--line:#2a2e33;--card:#1a1e22}}
body{margin:0 auto;max-width:44rem;padding:1.5rem 1rem 4rem;
  background:var(--bg);color:var(--fg);
  font:16px/1.5 system-ui,sans-serif}
h1{font-size:1.2rem}h2{font-size:1rem;margin-top:2rem}
button{font:inherit;padding:.4rem .9rem;border:1px solid var(--line);
  border-radius:6px;background:var(--card);color:var(--fg);
  cursor:pointer}
.item{background:var(--card);border-radius:8px;padding:.6rem .8rem;
  margin:.5rem 0;white-space:pre-wrap;word-break:break-word}
.item time{display:block;font-size:.8rem;color:var(--mut)}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:.25rem .5rem;
  border-bottom:1px solid var(--line);font-size:.9rem}
td:last-child,th:last-child{text-align:right}
.mut{color:var(--mut)}#err{color:#c33}
</style>
<h1>ClimateUmbral — back office
<button id="out" style="float:right">sign out</button></h1>
<p id="err"></p>
<h2>KPIs <span class="mut">(docs/KPIS.md)</span></h2>
<div id="kpi" class="mut">loading…</div>
<h2>Suggestions</h2><div id="sug" class="mut">loading…</div>
<h2>Place reports</h2><div id="rep" class="mut">loading…</div>
<h2>Counters</h2><div id="sta" class="mut">loading…</div>
<script>
var $=function(id){return document.getElementById(id)};
var esc=function(s){var d=document.createElement('div');
  d.textContent=s;return d.innerHTML};
$('out').onclick=function(){
  fetch('/api/admin/logout',{method:'POST'})
  .then(function(){location.reload()})};
fetch('/api/kpis').then(function(r){return r.json()})
.then(function(k){
  var week=function(ev){ // sum an event over the 7 newest days
    var days=Object.keys(k.daily||{}).sort().slice(-7),sum=0;
    days.forEach(function(d){
      var m=k.daily[d];
      Object.keys(m).forEach(function(e){
        if(e===ev||(ev==='page_*'&&e.indexOf('page_')===0))sum+=m[e]})});
    return sum};
  var rows=[
    ['flipped (done)',k.acts.flipped+' acts / '+
      k.acts.flipped_m2+' m² / '+
      k.acts.night_mdegc.toFixed(1)+' m°C night'],
    ['pledged (open)',k.acts.pledged+' acts'],
    ['flip rate (of resolved)',
      k.acts.flipped+k.acts.expired?
        Math.round(k.acts.flip_rate*100)+'% ('+
        k.acts.expired+' expired)':'—'],
    ['blocks with live acts',k.spread.blocks_with_acts],
    ['joins',k.spread.joins+' on '+k.spread.blocks_joined+
      ' block'+(k.spread.blocks_joined===1?'':'s')],
    ['reports open',k.reports_open],
    ['routes to a cool place, 7d',week('cool_route')],
    ['finder opens, 7d',week('cool_open')],
    ['finder shares, 7d',week('cool_share')],
    ['city-page visits, 7d',week('page_*')]];
  $('kpi').innerHTML='<table>'+rows.map(function(r){
    return '<tr><td>'+esc(String(r[0]))+'</td><td>'+
      esc(String(r[1]))+'</td></tr>'}).join('')+'</table>'})
.catch(function(){$('kpi').textContent='unavailable'});
fetch('/api/suggestions')
.then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);
  return r.text()})
.then(function(txt){
  var lines=txt.split('\n').filter(Boolean).reverse();
  if(!lines.length){$('sug').innerHTML='<span class=mut>none yet</span>';return}
  $('sug').innerHTML=lines.map(function(l){
    try{var o=JSON.parse(l);
      return '<div class=item><time>'+esc(o.ts||'')+'</time>'+
        esc(o.text||'')+'</div>'}
    catch(e){return ''}
  }).join('')})
.catch(function(e){$('sug').innerHTML='';
  $('err').textContent='suggestions: '+e.message});
// no-store: /api/reports is publicly cacheable for 5 min, but the
// operator arrives from a "new feedback" mail — stale counts here
// read as lost feedback. Refuge targets resolve to shelter names
// (matched on the 4-decimal coords baked into the report key).
Promise.all([
  fetch('/api/reports',{cache:'no-store'})
    .then(function(r){return r.json()}),
  fetch('/api/refuges').then(function(r){return r.json()})
    .catch(function(){return {refuges:[]}})
]).then(function(res){
  var m=res[0],names={};
  (res[1].refuges||[]).forEach(function(f){
    names[f.lon.toFixed(4)+','+f.lat.toFixed(4)]=f.name});
  var keys=Object.keys(m).sort(function(a,b){return m[b]-m[a]});
  if(!keys.length){$('rep').innerHTML='<span class=mut>none yet</span>';return}
  $('rep').innerHTML='<table><tr><th>place</th><th>issue</th>'+
    '<th>n</th></tr>'+keys.map(function(k){
      var i=k.lastIndexOf('|'),t=k.slice(0,i),label=t;
      var c=/^refuge:[^:]*:(.+)$/.exec(t);
      if(c&&names[c[1]])label=names[c[1]]+' — '+c[1];
      return '<tr><td>'+esc(label)+'</td><td>'+
        esc(k.slice(i+1))+'</td><td>'+m[k]+'</td></tr>'
    }).join('')+'</table>'})
.catch(function(){$('rep').textContent='unavailable'});
fetch('/api/stats').then(function(r){return r.json()})
.then(function(m){
  var keys=Object.keys(m).sort();
  $('sta').innerHTML='<table>'+keys.map(function(k){
    return '<tr><td>'+esc(k)+'</td><td>'+m[k]+'</td></tr>'
  }).join('')+'</table>'})
.catch(function(){$('sta').textContent='unavailable'});
</script>
